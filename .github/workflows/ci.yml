name: 🧪 Web CI

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: 📦 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📥 Install
        run: |
          git config --global url."https://github.com/".insteadOf "git+ssh://git@github.com/"
          yarn install

      - name: 🔨 Build
        run: yarn build

      - name: 📊 Build Summary
        if: always()
        run: |
          echo "### 🔨 Build Result: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
